[package]
name = "aegis-cli"
description = "The command-line program of AEGIS."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aegis"
path = "src/main.rs"

[features]
default = ["postgres", "plugins", "otlp"]
# PostgreSQL storage: `storage.kind = "postgres"` and `audit.kind = "postgres"`.
postgres = ["aegis-app/postgres"]
# WebAssembly connector plugins: the `[plugins]` section.
plugins = ["aegis-app/plugins"]
# The OpenTelemetry trace exporter: `telemetry.otlp_endpoint`.
otlp = ["aegis-app/otlp"]

[dependencies]
aegis-app.workspace = true
aegis-contracts.workspace = true
aegis-core.workspace = true
aegis-ingest.workspace = true
aegis-policy.workspace = true
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
futures.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
aegis-testkit.workspace = true

[lints]
workspace = true
