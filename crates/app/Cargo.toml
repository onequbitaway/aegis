[package]
name = "aegis-app"
description = "The composition root of AEGIS: builds all subsystems from one configuration and runs them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["postgres", "plugins", "otlp"]
# PostgreSQL storage: `storage.kind = "postgres"` and `audit.kind = "postgres"`.
postgres = ["dep:aegis-storage"]
# WebAssembly connector plugins: the `[plugins]` section.
plugins = ["dep:aegis-plugin"]
# The OpenTelemetry trace exporter of `aegis-core`.
otlp = ["aegis-core/otlp"]
# Tests that need Docker: PostgreSQL and NATS.
docker-tests = ["postgres"]

[dependencies]
aegis-agents.workspace = true
aegis-bus.workspace = true
aegis-contracts.workspace = true
aegis-core.workspace = true
aegis-detect.workspace = true
aegis-ingest.workspace = true
aegis-memory.workspace = true
aegis-model.workspace = true
aegis-plugin = { workspace = true, optional = true }
aegis-policy.workspace = true
aegis-respond.workspace = true
aegis-storage = { workspace = true, optional = true }
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util = "0.7.20"
tracing.workspace = true

[dev-dependencies]
aegis-testkit.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
uuid.workspace = true
wiremock = "0.6.5"

[lints]
workspace = true
