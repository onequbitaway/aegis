[package]
name = "aegis-plugin"
description = "A WebAssembly component host that loads out-of-tree AEGIS connectors in a sandbox."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aegis-contracts.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
toml = { version = "0.9.8", default-features = false, features = ["parse", "serde", "std"] }
url = "2.5.8"
wasmtime = { version = "=48.0.8", default-features = false, features = ["runtime", "cranelift", "component-model", "async", "std"] }
wasmtime-wasi = { version = "=48.0.8", default-features = false }

[dev-dependencies]
aegis-testkit.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["io-util", "net", "test-util"] }
wiremock = "0.6.5"

[lints]
workspace = true
