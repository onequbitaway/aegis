[package]
name = "aegis-respond"
description = "Response and actuation for AEGIS: the action dispatcher, action connectors, playbooks, and deception."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aegis-contracts.workspace = true
async-trait.workspace = true
chrono.workspace = true
hex.workspace = true
hmac = "0.13.0"
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde.workspace = true
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
url = "2.5.8"

[dev-dependencies]
aegis-testkit.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6.5"

[lints]
workspace = true
