name: Package

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow reads the repository and uses the Actions cache. It pushes no image and
# uses no secret.
permissions:
  contents: read

env:
  # Each tool image has a tag and a digest. Change the two together.
  HELM_IMAGE: alpine/helm:4.3.1@sha256:e3f8d5c462d75470fbb1fce79ad5c20063657096d1f98c0fcea869e2600e2e5e
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  # The versions of the Kubernetes API that the manifests must be valid for.
  KUBERNETES_VERSIONS: 1.31.0 1.34.0

jobs:
  images:
    name: Images and Compose stacks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AEGIS_IMAGE: aegis:ci
      AEGIS_MONITORING_IMAGE: aegis:ci-monitoring-only
      AEGIS_POSTGRES_IMAGE: aegis-postgres:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build stops if the Rust version is not the pinned version, or if the binary
      # is not statically linked. The dependencies are in a cached layer of their own.
      - name: Build the full image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/aegis/Dockerfile
          build-args: AEGIS_FEATURES=full
          tags: ${{ env.AEGIS_IMAGE }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=aegis-full
          cache-to: type=gha,scope=aegis-full,mode=max

      - name: Build the monitoring-only image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/aegis/Dockerfile
          build-args: AEGIS_FEATURES=monitoring-only
          tags: ${{ env.AEGIS_MONITORING_IMAGE }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=aegis-monitoring-only
          cache-to: type=gha,scope=aegis-monitoring-only,mode=max

      - name: Build the database image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/docker/postgres
          tags: ${{ env.AEGIS_POSTGRES_IMAGE }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=aegis-postgres
          cache-to: type=gha,scope=aegis-postgres,mode=max

      - name: Examine the images
        run: |
          set -euo pipefail
          for image in "$AEGIS_IMAGE" "$AEGIS_MONITORING_IMAGE"; do
            echo "== $image"
            docker image inspect "$image" --format 'size: {{.Size}} bytes, user: {{.Config.User}}'
            test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "65532:65532"
            test "$(docker image inspect "$image" --format '{{json .Config.Entrypoint}}')" = '["/aegis"]'
            # The image has no shell: this command must fail.
            if docker run --rm --entrypoint /bin/sh "$image" -c true 2>/dev/null; then
              echo "error: the image $image has a shell." >&2
              exit 1
            fi
            # Read the binary of the image and examine its type.
            container="$(docker create "$image")"
            docker cp "$container:/aegis" "$RUNNER_TEMP/aegis-binary"
            docker rm --volumes "$container" >/dev/null
            description="$(file --brief "$RUNNER_TEMP/aegis-binary")"
            echo "binary: $description"
            if ! echo "$description" | grep -E -q 'statically linked|static-pie linked'; then
              echo "error: the binary of $image is not statically linked." >&2
              exit 1
            fi
            docker run --rm "$image" --version
          done

      # The demonstration replays the recorded attack log in the process. The container
      # has a read-only root file system, no capability, and no network.
      - name: Run the demonstration in the image
        run: |
          set -euo pipefail
          hardened=(--rm --read-only --tmpfs /tmp:mode=1777 --cap-drop ALL
            --security-opt no-new-privileges --network none)
          docker run "${hardened[@]}" "$AEGIS_IMAGE" demo
          docker run "${hardened[@]}" "$AEGIS_IMAGE" --format json demo > "$RUNNER_TEMP/demo.json"
          jq --exit-status '
            .audit.verification.valid == true
            and .audit.records > 0
            and (.detections | length) > 0
            and (.incidents | length) > 0
            and .dry_run == true
          ' "$RUNNER_TEMP/demo.json"

      # The configuration that the Helm chart makes must be valid for the binary. The
      # container has the limits of the pod.
      - name: Check the configuration of the Helm chart with the binary
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/chart-config"
          mkdir -p "$directory"
          docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$PWD:/repo:ro" --workdir /repo "$HELM_IMAGE" \
            template aegis deploy/helm/aegis --namespace aegis \
            --show-only templates/configmap.yaml > "$directory/configmap.yaml"
          # The text of aegis.toml is the last value of the ConfigMap, with four spaces
          # before each line.
          sed -n '/^  aegis\.toml: |$/,$p' "$directory/configmap.yaml" | tail -n +2 | sed 's/^    //' \
            > "$directory/aegis.toml"
          test -s "$directory/aegis.toml"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --network none \
            --env AEGIS_TOKEN_OPERATOR="$(openssl rand -hex 32)" \
            --volume "$directory/aegis.toml:/etc/aegis/aegis.toml:ro" \
            --volume "$PWD/policies:/etc/aegis/policies:ro" \
            --volume "$PWD/detections:/etc/aegis/detections:ro" \
            --volume "$PWD/playbooks:/etc/aegis/playbooks:ro" \
            "$AEGIS_IMAGE" --format json config check --config /etc/aegis/aegis.toml

      # The overlay of the profile `local-model` must give a valid [model] section, and
      # the profile must add the model server. The workflow downloads no model.
      - name: Check the overlay of the profile local-model
        run: |
          set -euo pipefail
          volume="aegis-package-starter"
          docker volume create "$volume" >/dev/null
          docker run --rm --volume "$volume:/etc/aegis" "$AEGIS_IMAGE" init --dir /etc/aegis >/dev/null
          docker run --rm --network none --volume "$volume:/etc/aegis" \
            --env-file deploy/compose/local-model.env \
            "$AEGIS_IMAGE" --format json config check --config /etc/aegis/aegis.toml \
            | jq --exit-status '.valid == true and .summary.model == true'
          docker volume rm "$volume" >/dev/null

          cd deploy/compose
          export AEGIS_POSTGRES_PASSWORD=unused AEGIS_NATS_TOKEN=unused AEGIS_TOKEN_OPERATOR=unused
          test "$(docker compose config --services | sort | tr '\n' ' ')" = "aegis nats postgres "
          test "$(docker compose --env-file local-model.env config --services | sort | tr '\n' ' ')" \
            = "aegis nats ollama postgres "

      - name: Start the Compose stack
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          # The secrets of this run. The file is not in the repository.
          {
            echo "AEGIS_POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "AEGIS_NATS_TOKEN=$(openssl rand -hex 24)"
            echo "AEGIS_TOKEN_OPERATOR=$(openssl rand -hex 32)"
            echo "AEGIS_API_PORT=8080"
          } > .env
          docker compose up --detach --no-build --wait --wait-timeout 180
          docker compose ps

      # AEGIS reads the recorded attack log from the file source, through NATS, into
      # PostgreSQL. The checks wait for the incident. They do not wait for a fixed time.
      - name: Check that the stack processed the recorded attack log
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          token="$(sed -n 's/^AEGIS_TOKEN_OPERATOR=//p' .env)"
          api="http://127.0.0.1:8080"

          test "$(curl --fail --silent --show-error "$api/healthz" | jq --raw-output .status)" = "ok"
          # A request with no token must be refused.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$api/api/v1/incidents")" = "401"

          incidents="$RUNNER_TEMP/incidents.json"
          deadline=$((SECONDS + 120))
          until curl --fail --silent --show-error --header "Authorization: Bearer $token" \
                  "$api/api/v1/incidents" > "$incidents" \
              && jq --exit-status '[.items[] | select(.severity == "critical")] | length > 0' "$incidents" >/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "error: the API shows no critical incident after 120 seconds." >&2
              cat "$incidents" >&2 || true
              exit 1
            fi
            sleep 2
          done
          jq '.items[] | {id, title, severity, status, detections: (.detections | length)}' "$incidents"
          # The first step of the recorded attack is a password spray (ATT&CK T1110.003).
          jq --exit-status '[.items[].detections[].attack[].technique_id] | index("T1110.003") != null' "$incidents"

          echo "The incident rows in PostgreSQL:"
          rows="$(docker compose exec -T postgres psql --username aegis --dbname aegis \
            --no-align --tuples-only --command 'select count(*) from aegis.incidents')"
          echo "$rows"
          test "$rows" -ge 1

          echo "The audit chain, through the API and from the file:"
          curl --fail --silent --show-error --header "Authorization: Bearer $token" \
            "$api/api/v1/audit/verification" | jq --exit-status '.valid == true and .checked > 0'
          docker compose exec -T aegis /aegis audit verify --path /var/lib/aegis/audit.jsonl

          echo "The container of AEGIS:"
          docker inspect "$(docker compose ps --quiet aegis)" --format \
            'user={{.Config.User}} read_only={{.HostConfig.ReadonlyRootfs}} cap_drop={{.HostConfig.CapDrop}} security_opt={{.HostConfig.SecurityOpt}}'
          test "$(docker inspect "$(docker compose ps --quiet aegis)" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"

          # The database and the NATS server have no port on the host. The operator API
          # has a port on the loopback address only.
          published() {
            docker inspect "$(docker compose ps --quiet "$1")" --format \
              '{{range $port, $bindings := .NetworkSettings.Ports}}{{range $bindings}}{{.HostIp}}:{{.HostPort}} {{end}}{{end}}'
          }
          test -z "$(published postgres)"
          test -z "$(published nats)"
          test "$(published aegis)" = "127.0.0.1:8080 "

      - name: Show the logs of the Compose stack
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color --tail 200

      - name: Remove the Compose stack
        if: always()
        working-directory: deploy/compose
        run: |
          docker compose down --volumes --remove-orphans
          rm -f .env

      # The monitoring-only variant: one container with no database and no NATS server.
      - name: Run the monitoring-only Compose variant
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          compose=(docker compose --file compose.monitoring-only.yaml)
          # The text report of the service of the file.
          "${compose[@]}" up --no-build --abort-on-container-exit --exit-code-from aegis
          # The same session as JSON Lines, for the checks.
          "${compose[@]}" run --rm --no-deps -T aegis --format json monitor \
            --config /etc/aegis/aegis.toml --events /etc/aegis/events/artex_style_attack.jsonl \
            > "$RUNNER_TEMP/monitor.jsonl"
          jq --slurp --exit-status '
            ([.[] | select(.type == "detection")] | length) > 0
            and ([.[] | select(.type == "summary")] | length) == 1
            and ([.[] | select(.type == "summary")][0].actions == 0)
          ' "$RUNNER_TEMP/monitor.jsonl"
          test "$("${compose[@]}" config --services)" = "aegis"

      - name: Remove the monitoring-only Compose variant
        if: always()
        working-directory: deploy/compose
        run: docker compose --file compose.monitoring-only.yaml down --volumes --remove-orphans

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The chart reads the starter files through links to the root of the repository.
      # Thus the Helm container gets the full checkout, as read-only.
      - name: Lint the chart
        run: |
          set -euo pipefail
          helm() {
            docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/repo:ro" --workdir /repo "$HELM_IMAGE" "$@"
          }
          helm version
          helm lint --strict deploy/helm/aegis
          helm lint --strict deploy/helm/aegis \
            --values deploy/helm/aegis/examples/external-postgres-nats.values.yaml

      - name: Render the chart and check the manifests against the Kubernetes schemas
        run: |
          set -euo pipefail
          helm() {
            docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/repo:ro" --workdir /repo "$HELM_IMAGE" "$@"
          }
          helm template aegis deploy/helm/aegis --namespace aegis > "$RUNNER_TEMP/default.yaml"
          helm template aegis deploy/helm/aegis --namespace aegis \
            --values deploy/helm/aegis/examples/external-postgres-nats.values.yaml \
            --set ingress.enabled=true > "$RUNNER_TEMP/external.yaml"
          for version in $KUBERNETES_VERSIONS; do
            for manifest in default external; do
              echo "== $manifest.yaml, Kubernetes $version"
              docker run --rm --interactive "$KUBECONFORM_IMAGE" \
                -strict -summary -kubernetes-version "$version" - < "$RUNNER_TEMP/$manifest.yaml"
            done
          done

      # deploy/k8s has the manifests of the default values. The chart is the source.
      - name: Check that the manifests in deploy/k8s are current
        run: |
          set -euo pipefail
          docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$PWD:/repo:ro" --workdir /repo "$HELM_IMAGE" \
            template aegis deploy/helm/aegis --namespace aegis > "$RUNNER_TEMP/default.yaml"
          if ! diff --unified deploy/k8s/aegis.yaml "$RUNNER_TEMP/default.yaml"; then
            echo "error: deploy/k8s/aegis.yaml is not current. Render it again. Refer to deploy/k8s/README.md." >&2
            exit 1
          fi

      # The chart must refuse values that cannot work.
      - name: Check that the chart refuses a second replica
        run: |
          set -euo pipefail
          if docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/repo:ro" --workdir /repo "$HELM_IMAGE" \
              template aegis deploy/helm/aegis --set replicaCount=2 > /dev/null 2> "$RUNNER_TEMP/replicas.err"; then
            echo "error: the chart accepted replicaCount=2." >&2
            exit 1
          fi
          grep --quiet 'replicaCount must be 0 or 1' "$RUNNER_TEMP/replicas.err"
