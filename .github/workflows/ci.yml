name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug data and incremental data make the build directory larger than the disk of the
  # runner. The tests do not need them.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: Format, lint, test, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Restore the build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            plugins/target
          key: cargo-nodebug-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'plugins/Cargo.lock') }}
          restore-keys: |
            cargo-nodebug-${{ runner.os }}-

      - name: Check the format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The docker-tests features start disposable PostgreSQL and NATS containers.
      - name: Test with all features
        run: cargo test --workspace --all-features --locked

      # One test of aegis-core compiles only when the otlp feature is off.
      - name: Test the core crate with default features
        run: cargo test -p aegis-core --locked

      - name: Build the documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  plugins:
    name: Example plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Check the format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --target wasm32-wasip2 --release --locked -- -D warnings

      - name: Build
        run: cargo build --target wasm32-wasip2 --release --locked
