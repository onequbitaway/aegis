# The NATS server of the AEGIS Compose stack: one server with JetStream.
#
# `compose.yaml` gives the token of the clients with the `--auth` option. This file has
# no secret.

server_name: aegis-nats

# The client port. The Compose file does not publish it on the host.
port: 4222

# The monitoring port, only on the loopback address of the container. The health check
# reads it.
http: "127.0.0.1:8222"

jetstream {
  store_dir: "/data"
  # The largest size of all streams in memory and on the disk. The stream of AEGIS has a
  # default limit of 1 GiB on the disk (`bus.stream.max_bytes`).
  max_memory_store: 256MB
  max_file_store: 4GB
}
