{{- if .Values.networkPolicy.enabled }}
# The pod of AEGIS accepts and makes only the connections that this policy lists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.api.enabled }}
  ingress:
    # The operator API.
    - ports:
        - protocol: TCP
          port: {{ int .Values.api.port }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- else }}
  # The process opens no listener.
  ingress: []
  {{- end }}
  {{- if or .Values.networkPolicy.allowDns .Values.networkPolicy.egress }}
  egress:
    {{- if .Values.networkPolicy.allowDns }}
    # DNS queries to the DNS service of the cluster.
    - to:
        {{- toYaml (list .Values.networkPolicy.dns) | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
