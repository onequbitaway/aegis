---
# Source: aegis/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis
  namespace: aegis
  labels:
    helm.sh/chart: aegis-0.1.0
    app.kubernetes.io/name: aegis
    app.kubernetes.io/instance: aegis
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: aegis
spec:
  # One replica: the file audit log has one writer, and the state of the detection
  # engine is in the memory of one process.
  replicas: 1
  # Stop the old pod before the new pod starts. Two pods cannot write one audit log, and
  # a ReadWriteOnce volume goes to one node.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis
      app.kubernetes.io/instance: aegis
  template:
    metadata:
      labels:
        helm.sh/chart: aegis-0.1.0
        app.kubernetes.io/name: aegis
        app.kubernetes.io/instance: aegis
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: aegis
      annotations:
        # A change of the configuration or of the starter files starts a new pod.
        checksum/config: 6afd4bc6b05929535f9a9dc025c68b7578257044497dcf10c893d0c0bcf6590b
        checksum/starter: 56b7e0734ad12d53bf81eb9d21ca1793702f9fb09ee83da0e529665cf23f8b66
    spec:
      serviceAccountName: aegis
      # AEGIS does not call the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: aegis
          image: registry.example.com/aegis/aegis:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["run", "--config", "/etc/aegis/aegis.toml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: AEGIS_TOKEN_OPERATOR
              valueFrom:
                secretKeyRef:
                  name: aegis-credentials
                  key: operator-token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/aegis
              readOnly: true
            - name: data
              mountPath: /var/lib/aegis
            - name: plugins
              mountPath: /plugins
              readOnly: true
      volumes:
        # /etc/aegis: the configuration file and the starter files, as one read-only
        # directory.
        - name: config
          projected:
            defaultMode: 0444
            sources:
              - configMap:
                  name: aegis
                  items:
                    - key: aegis.toml
                      path: aegis.toml
              - configMap:
                  name: aegis-starter
                  items:
                    - key: detections__aegis-identity__indicators__examples.yml
                      path: detections/aegis-identity/indicators/examples.yml
                    - key: detections__aegis-identity__pack.yml
                      path: detections/aegis-identity/pack.yml
                    - key: detections__aegis-identity__rules__account_locked_after_failed_sign_ins.yml
                      path: detections/aegis-identity/rules/account_locked_after_failed_sign_ins.yml
                    - key: detections__aegis-identity__rules__consent_to_privileged_permissions.yml
                      path: detections/aegis-identity/rules/consent_to_privileged_permissions.yml
                    - key: detections__aegis-identity__rules__decoy_canary_hit.yml
                      path: detections/aegis-identity/rules/decoy_canary_hit.yml
                    - key: detections__aegis-identity__rules__decoy_contact.yml
                      path: detections/aegis-identity/rules/decoy_contact.yml
                    - key: detections__aegis-identity__rules__honeytoken_used.yml
                      path: detections/aegis-identity/rules/honeytoken_used.yml
                    - key: detections__aegis-identity__rules__legacy_mail_protocol_sign_in.yml
                      path: detections/aegis-identity/rules/legacy_mail_protocol_sign_in.yml
                    - key: detections__aegis-identity__rules__mfa_method_changed_by_script_client.yml
                      path: detections/aegis-identity/rules/mfa_method_changed_by_script_client.yml
                    - key: detections__aegis-identity__rules__mfa_request_denied.yml
                      path: detections/aegis-identity/rules/mfa_request_denied.yml
                    - key: detections__aegis-identity__rules__privileged_application_permission_granted.yml
                      path: detections/aegis-identity/rules/privileged_application_permission_granted.yml
                    - key: detections__aegis-identity__rules__privileged_role_assigned_by_workload_identity.yml
                      path: detections/aegis-identity/rules/privileged_role_assigned_by_workload_identity.yml
                    - key: detections__aegis-identity__rules__user_created_by_workload_identity.yml
                      path: detections/aegis-identity/rules/user_created_by_workload_identity.yml
                    - key: playbooks__README.md
                      path: playbooks/README.md
                    - key: playbooks__block-password-spray-source.yaml
                      path: playbooks/block-password-spray-source.yaml
                    - key: playbooks__contain-compromised-user.yaml
                      path: playbooks/contain-compromised-user.yaml
                    - key: playbooks__contain-rogue-service-principal.yaml
                      path: playbooks/contain-rogue-service-principal.yaml
                    - key: playbooks__isolate-compromised-host.yaml
                      path: playbooks/isolate-compromised-host.yaml
                    - key: playbooks__raise-friction-critical-identity-incident.yaml
                      path: playbooks/raise-friction-critical-identity-incident.yaml
                    - key: playbooks__respond-to-honeytoken-trip.yaml
                      path: playbooks/respond-to-honeytoken-trip.yaml
                    - key: policies__README.md
                      path: policies/README.md
                    - key: policies__default.rego
                      path: policies/default.rego
                    - key: policies__examples__auto_contain_service_principals.rego
                      path: policies/examples/auto_contain_service_principals.rego
                    - key: policies__examples__contain_first_with_timed_revert.rego
                      path: policies/examples/contain_first_with_timed_revert.rego
                    - key: policies__examples__maintenance_window.rego
                      path: policies/examples/maintenance_window.rego
                    - key: policies__examples__protected_entities.rego
                      path: policies/examples/protected_entities.rego
                    - key: policies__examples__protected_entities.yaml
                      path: policies/examples/protected_entities.yaml
        # /var/lib/aegis: the audit log and the checkpoints of the sources.
        - name: data
          persistentVolumeClaim:
            claimName: aegis-data
        # /plugins: the connector plugins.
        - name: plugins
          emptyDir:
            sizeLimit: 1Mi
