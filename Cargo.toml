[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/onequbitaway/aegis"
publish = false

[workspace.dependencies]
aegis-contracts = { path = "crates/contracts" }
aegis-memory = { path = "crates/memory" }
aegis-testkit = { path = "crates/testkit" }

anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
futures = "0.3.34"
futures-core = "0.3.34"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["serde", "v7"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
